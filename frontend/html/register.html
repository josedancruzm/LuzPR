<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=\, initial-scale=1.0">
  <title>LuzPR | Login Form</title>
  <link rel="stylesheet" href="../css/register.css">
  <link rel="stylesheet" href="../css/global.css">
</head>

<!--i feel be commenting a lot because im getting lost with the classes!-->

<body>

  <!--header with side bar icon, project logo, and user icon-->
  <div class="page-header">

    <!--side bar icon-->
    <div class="side-bar">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-menu-icon lucide-menu">
        <path d="M4 5h16" />
        <path d="M4 12h16" />
        <path d="M4 19h16" />
      </svg>
    </div>

    <!--project logo-->
    <h2>LuzPR 💡</h2>

    <!--user icon-->
    <div class="user-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-user-icon lucide-user">
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>
    </div>
  </div>

  <!--contains everything froim the Welcome sign to the Register here link-->
  <div class="form-container">

    <!--Text above the input boxes-->
    <div class="form-header">
      <p class="welcome">Welcome to MiLuzPR!</p>
      <p class="sign-in">Register Account</p>
    </div>

    <!--contains input boxes and buttons-->
    <form class="form-body" id="register-form">

      <div class="double-group">
        <div class="fname-group">
          <p class="fname">First Name</p>
          <input type="text" id="register-fname" class="input-field" placeholder=" ">
        </div>
        <div class="lname-group">
          <p class="fname">Last Name</p>
          <input type="text" id="register-lname" class="input-field" placeholder=" ">
        </div>
      </div>

      <div class="double-group">
        <div class="luma-group">
          <p class="luma-number">Luma Number</p>
          <input type="text" id="register-luma-number" class="input-field" placeholder=" ">
        </div>
        <div class="ssn-group">
          <p class="ssn">Last 4 Digits - SSN</p>
          <input type="text" id="register-ssn" class="input-field" placeholder=" ">
        </div>
      </div>

      <div class="username-group">
        <p class="username">Username</p>

        <input type="text" id="register-username" class="input-field" placeholder=" ">
      </div>

      <div class="password-group">
        <p class="password">Password</p>
        <div class="password-group-input">
          <input type="password" id="register-password" class="input-field" placeholder=" ">

          <!--eye icon toggle-->
          <div class="eye-icon" onclick="togglePassword()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-eye-icon lucide-eye">
              <path
                d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </div>
        </div>
      </div>

      <!--finish register button-->
      <button type="submit" class="submit">
        Finish register
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8L22 12L18 16" />
          <path d="M2 12H22" />
        </svg>
      </button>
    </form>

  </div>

  <div class="page-footer">
    <div class="language">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-globe-icon lucide-globe">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
        <path d="M2 12h20" />
      </svg>
    </div>
  </div>
  <script src="../../frontend/js/account.js"></script>

</body>

</html>
