<!DOCTYPE html>
<html>

<head>
    <title>LuzPR | street light map</title>
    <!--link hosting leaflet-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
    <link rel="stylesheet" href="../css/map.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/modal.css">
</head>

<body>

    <!--header with side bar icon, project logo, and user icon-->
    <div class="page-header">

        <!--side bar icon-->
        <div class="side-bar">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-menu-icon lucide-menu">
                <path d="M4 5h16" />
                <path d="M4 12h16" />
                <path d="M4 19h16" />
            </svg>
        </div>

        <!--project logo-->
        <h2>LuzPR 💡</h2>

        <!--user icon-->
        <div class="user-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-user-icon lucide-user">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
            </svg>
        </div>
    </div>

    <!--map container containing map-->
    <div class="map-container">
        <div id="map"></div>
    </div>

    <!-- Modal Section --------------------------------------------------------------------->

    <!--modal for street light details-->
    <dialog id="details-dialog">
        <div class="header">

            <!--report flag-->
            <div class="icon-circle btn-report" title="Report" onclick="openReportDialog()" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-flag-triangle-right-icon lucide-flag-triangle-right">
                    <path d="M6 22V2.8a.8.8 0 0 1 1.17-.71l11.38 5.69a.8.8 0 0 1 0 1.44L6 15.5" />
                </svg>
            </div>

            <!--x close-->
            <div class="icon-circle btn-close" title="Close" onclick="closeDetailsDialog()" type="button">

                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-x-icon lucide-x">
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                </svg>
            </div>
        </div>

        <div class="body">
            <b>ID:</b> <span id="detail-id"></span><br>
            <b>Coordinates:</b> <span id="detail-coords"></span><br>
            <b>City:</b> <span id="detail-city"></span><br>
        </div>
    </dialog>

    <!--modal for reporting-->
    <dialog id="report-dialog">
        <div class="header">
            <!--x close-->
            <div class="icon-circle btn-close" title="Close" onclick="closeReportDialog()" type="button">

                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-x-icon lucide-x">
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                </svg>
            </div>
        </div>

        <div class="body">
            <h2>Report Form</h2>
            <form id="report-form">
                <fieldset>
                    <legend>What's the issue?</legend>
                    <label><input type="checkbox" name="reason" value="out"> Light is out / broken</label>
                    <label><input type="checkbox" name="reason" value="flickering"> Light is flickering</label>
                    <label><input type="checkbox" name="reason" value="damaged"> Damaged pole / fixture</label>
                    <label><input type="checkbox" name="reason" value="other"> Other <input type="text"></label>
                </fieldset>
            </form>
        </div>

        <div class="footer">
            <div class="icon-circle btn-submit" title="Submit" onclick="incompleteReportForm()" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-send-icon lucide-send">
                    <path
                        d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" />
                    <path d="m21.854 2.147-10.94 10.939" />
                </svg>
            </div>
        </div>
    </dialog>

    <!--modal for receipt-->
    <dialog id="receipt-dialog">
        <h2>Report Form</h2>
        <h3>Success!</h3>
        <p id="receipt-message"></p>
        <div class="receipt-dialog-buttons">
            <svg onclick="closeReceiptDialog()" type="button" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" class="lucide lucide-x-icon lucide-x">
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
            </svg>
        </div>
    </dialog>

    <script src="../../backend/js/map.js"></script>
    <script src="../../backend/js/modal.js"></script>

</body>

</html>
