<!DOCTYPE html>
<html>

<head>
    <title>LuzPR | Light post map</title>
    <!--link hosting leaflet-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
    <link rel="stylesheet" href="../css/map.css">
</head>

<body>

    <!--header with side bar icon, project logo, and user icon-->
    <div class="header">

        <!--side bar icon-->
        <div class="side-bar">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-menu-icon lucide-menu">
                <path d="M4 5h16" />
                <path d="M4 12h16" />
                <path d="M4 19h16" />
            </svg>
        </div>

        <!--project logo-->
        <h2>LuzPR 💡</h2>

        <!--user icon-->
        <div class="user-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-user-icon lucide-user">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
            </svg>
        </div>
    </div>

    <!--map container containing map-->
    <div class="map-container">
        <div id="map"></div>
    </div>

    <!--modal for reporting-->
    <dialog id="report-dialog">
        <h2>Report Form</h2>
        <form id="report-form">
            <fieldset>
                <legend>What's the issue?</legend>
                <label><input type="checkbox" name="reason" value="out"> Light is out / broken</label>
                <label><input type="checkbox" name="reason" value="flickering"> Light is flickering</label>
                <label><input type="checkbox" name="reason" value="damaged"> Damaged pole / fixture</label>
                <label><input type="checkbox" name="reason" value="other"> Other <input type="text"></label>
            </fieldset>
            <div class="report-dialog-buttons">
                <button type="submit">Submit</button>
                <svg onclick="closeReportDialog()" type="button" xmlns="http://www.w3.org/2000/svg" width="24"
                    height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x">
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                </svg>
            </div>
        </form>
    </dialog>

    <!--modal for receipt-->
    <dialog id="receipt-dialog">
        <h2>Report Form</h2>
        <h3>Success!</h3>
        <p id="receipt-message"></p>
        <div class="receipt-dialog-buttons">
            <svg onclick="closeReceiptDialog()" type="button" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" class="lucide lucide-x-icon lucide-x">
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
            </svg>
        </div>
    </dialog>

    <script src="../js/map.js"></script>

</body>

</html>
