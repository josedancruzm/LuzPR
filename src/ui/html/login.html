<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=\, initial-scale=1.0">
  <title>LuzPR | Login Form</title>
  <link rel="stylesheet" href="../css/login.css">
</head>

<body>
  <div class="form-container">

    <div class="form-header">
      <p class="form-header--welcome">Welcome to MiLuzPR!</p>
      <p class="form-header--sign-in">Sign in</p>
    </div>
    <form class="form-box" action="map.html">
      <div class="input-group">
        <input type="text" id="username" class="input-field" placeholder=" ">
        <label for="username" class="floating-label">Username</label>
      </div>

      <div class="input-group">
        <input type="password" id="password" class="input-field" placeholder=" ">
        <label for="password" class="floating-label">Password</label>
        <div class="eye-icon" onclick="togglePassword()">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-eye-icon lucide-eye">
            <path
              d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </div>
      </div>
      <div class="input-group checkbox-group">
        <div class="form-col remember-me">
          <input type="checkbox" id="remember-me-checkbox" class="checkbox-field">
          <label for="remember-me-checkbox">Remember me</label>
        </div>
        <div class="form-col">
          <a href="#" class="form-link">Forgot password?</a>
        </div>
      </div>
      <button type="submit" class="form-btn form-btn--submit">
        Sign in
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8L22 12L18 16" />
          <path d="M2 12H22" />
        </svg>
      </button>
    </form>

    <div class="form-bottom">
      <p>Don't have an account? <a href="#" class="form-link">Sign up</a></p>
    </div>

  </div>
  <script src="../js/login.js"></script>

</body>

</html>
