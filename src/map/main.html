<!DOCTYPE html>
<html>

<head>
    <!--link hosting leaflet-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        body {
            background: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            padding: 4px;
        }

        #header {
            align-items: center;
            background: white;
            display: flex;
            height: 50px;
            padding: 0.5rem 1rem;
            width: 200px;
        }

        #header h2 {
            color: #4e7524;
            font-weight: 100;
            font-family: fantasy;
        }

        #content {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        #sidebar {
            background: linear-gradient(180deg, #93d952 2%, #27C1DC 56%, #0087BD 100%);
            border-radius: 8px;
            flex-shrink: 0;
            margin-bottom: 8px;
            padding: 1rem;
            width: 200px;
        }

        #sidebar a {
            color: #17214c;
            font-family: fantasy;
            font-size: 1rem;
        }

        #map {
            border-radius: 8px;
            flex: 1;
            height: auto;
            margin-bottom: 8px;
            margin-left: 4px;
            min-height: 0;
        }
    </style>
</head>

<body>
    <div id="header">
        <h2>LuzPR 💡</h2>
    </div>
    <div id="content">
        <div id="sidebar">
            <a>
                <img src="assets/icons/home.png" width="16" height="16">
                Home
            </a>
        </div>
        <div id="map"></div>

    </div>

    <script>
        var map = L.map('map', {
            maxBounds: [[17.820447, -68.012458], [18.555231, -65.111299]],
            maxBoundsViscosity: 1.0,
            minZoom: 10
        }).setView([18.2, -66.5], 10);

        L.tileLayer('https://api.maptiler.com/maps/streets-v4/{z}/{x}/{y}.png?key=KdpEk71LcB3GnVCNZ9CR', {
            attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>',
        }).addTo(map);

        fetch("http://localhost:8000/lightposts")
            .then(res => res.json())
            .then(data => {

                //block of code that maps lightpost icon
                var customIcon = L.icon({
                    iconUrl: 'assets/icons/lightpost_icon_ON.png',
                    iconSize: [32, 32],
                    iconAnchor: [16, 32],
                    popupAnchor: [0, -32]
                });

                data.forEach(row => {
                    L.marker([row.latitude, row.longitude], { icon: customIcon })
                        //.bindPopup(row.light_post_id)
                        .addTo(map);
                });
            });
    </script>
</body>

</html>
